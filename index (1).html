<body class="min-h-full flex flex-col justify-center items-center p-3 sm:p-6 antialiased selection:bg-blue-500/20 selection:text-blue-200">

                    <button

                <!-- Author Info Header -->

                        <span class="hover:text-blue-300 transition-colors cursor-pointer">#beginners</span>
                        <span class="hover:text-blue-300 transition-colors cursor-pointer">#trader</span>
                    </div>

                <!-- Engagement Bar -->
                <div class="flex items-center justify-between pt-2 border-t border-white/5 text-slate-400 text-xs">

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize Lucide Icons
            lucide.createIcons();

            const video = document.getElementById('videoElement');
            const playOverlayBtn = document.getElementById('playOverlayBtn');
            const mainPlayIcon = document.getElementById('mainPlayIcon');
            const playIconBg = document.getElementById('playIconBg');
            const muteToggleBtn = document.getElementById('muteToggleBtn');
            const muteIcon = document.getElementById('muteIcon');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const followBtn = document.getElementById('followBtn');
            const likeBtn = document.getElementById('likeBtn');
            const heartIcon = document.getElementById('heartIcon');
            const likeCount = document.getElementById('likeCount');
            const shareBtn = document.getElementById('shareBtn');
            const shareText = document.getElementById('shareText');

            let isLiked = false;
            let likes = 12400;

            // Muted by default for auto-play browser compliance
            video.muted = true;

            // Play / Pause video logic
            function togglePlay() {
                if (video.paused) {
                    video.play().then(() => {
                        playIconBg.classList.add('opacity-0', 'scale-75');
                        mainPlayIcon.setAttribute('data-lucide', 'pause');
                        lucide.createIcons();
                    }).catch(err => {
                        console.log("Autoplay prevented or video play error:", err);
                    });
                } else {
                    video.pause();
                    playIconBg.classList.remove('opacity-0', 'scale-75');
                    mainPlayIcon.setAttribute('data-lucide', 'play');
                    lucide.createIcons();
                }
            }

            playOverlayBtn.addEventListener('click', togglePlay);

            // Timeline update
            video.addEventListener('timeupdate', () => {
                if (video.duration) {
                    const progressPercent = (video.currentTime / video.duration) * 100;
                    progressBar.style.width = `${progressPercent}%`;
                }
            });

            // Timeline click seek
            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const clickPosition = (e.clientX - rect.left) / rect.width;
                video.currentTime = clickPosition * video.duration;
            });

            // Mute / Unmute audio
            muteToggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                video.muted = !video.muted;
                muteIcon.setAttribute('data-lucide', video.muted ? 'volume-x' : 'volume-2');
                lucide.createIcons();
            });

            // Reset interface when video ends
            video.addEventListener('ended', () => {
                playIconBg.classList.remove('opacity-0', 'scale-75');
                mainPlayIcon.setAttribute('data-lucide', 'play');
                lucide.createIcons();
            });

            // Interactive UI Actions
            followBtn.addEventListener('click', () => {
                if (followBtn.innerText === 'Follow') {
                    followBtn.innerText = 'Following';
                    followBtn.classList.replace('bg-blue-600', 'bg-white/10');
                    followBtn.classList.add('text-slate-300');
                } else {
                    followBtn.innerText = 'Follow';
                    followBtn.classList.replace('bg-white/10', 'bg-blue-600');
                    followBtn.classList.remove('text-slate-300');
                }
            });

            likeBtn.addEventListener('click', () => {
                isLiked = !isLiked;
                likes += isLiked ? 1 : -1;
                likeCount.innerText = (likes / 1000).toFixed(1) + 'k';
                if (isLiked) {
                    heartIcon.classList.add('text-red-500', 'fill-red-500');
                } else {
                    heartIcon.classList.remove('text-red-500', 'fill-red-500');
                }
            });

            shareBtn.addEventListener('click', () => {
                shareText.innerText = 'Copied!';
                setTimeout(() => {
                    shareText.innerText = 'Share';
                }, 2000);
            });
        });
    </script>
</body>
</html>
